<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>不朽神話 裁縫之翼殞落之地</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="styles.css?v=20260824-clean-puzzles" />
  </head>
  <body>
    <main class="shell" aria-labelledby="site-title">
      <div class="aura" aria-hidden="true"></div>

      <nav class="section-nav">
        <button class="section-tab is-active" type="button" data-view="story">故事</button>
        <button class="section-tab" type="button" data-view="character">角色</button>
        <button class="section-tab" type="button" data-view="puzzle">解謎</button>
      </nav>

      <section class="view is-active" data-view-panel="story">
        <div class="drag-viewport">
          <div class="home drag-surface">
            <div class="title-wrap">
              <p>故事</p>
              <h1 id="site-title">不朽神話 裁縫之翼殞落之地</h1>
            </div>
            <div class="story-grid" id="story-grid"></div>
          </div>
        </div>
      </section>

      <section class="view" data-view-panel="character">
        <div class="drag-viewport">
          <div class="collection-surface drag-surface">
            <h2 class="view-title">角色</h2>
            <div class="character-groups" id="character-grid"></div>
          </div>
        </div>
      </section>

      <section class="view" data-view-panel="puzzle">
        <div class="drag-viewport">
          <div class="collection-surface drag-surface puzzle-surface">
            <h2 class="view-title">解謎</h2>
            <div class="puzzle-grid" id="puzzle-grid"></div>
          </div>
        </div>
      </section>
    </main>

    <dialog class="chapter-intro" id="chapter-intro">
      <div class="chapter-intro-image"></div>
    </dialog>

    <dialog class="modal" id="text-modal">
      <div class="modal-body">
        <button class="close" type="button" data-close>×</button>
        <p class="modal-kicker" id="modal-type"></p>
        <h2 id="modal-title"></h2>
        <div class="modal-text" id="modal-text"></div>
      </div>
    </dialog>

    <dialog class="character-modal" id="character-modal">
      <div class="character-modal-body">
        <button class="close" type="button" data-character-close>×</button>
        <div class="character-hero" id="character-hero">
          <div class="character-heading">
            <p class="modal-kicker" id="character-group"></p>
            <h2 id="character-name"></h2>
          </div>
        </div>
        <div class="character-text" id="character-text"></div>
      </div>
    </dialog>

    <dialog class="modal reward-modal" id="reward-modal">
      <div class="modal-body">
        <button class="close" type="button" data-reward-close>×</button>
        <p class="modal-kicker" id="reward-type"></p>
        <div class="modal-text" id="reward-text"></div>
      </div>
    </dialog>

    <dialog class="chapter-modal" id="chapter-modal">
      <div class="chapter-sheet">
        <button class="close" type="button" data-chapter-close>×</button>
        <p class="modal-kicker" id="chapter-type"></p>
        <h2 id="chapter-title"></h2>
        <p class="chapter-name" id="chapter-name"></p>
        <div class="chapter-text" id="chapter-text"></div>
        <nav class="chapter-pagination" id="chapter-pagination" aria-label="章節分頁" hidden>
          <button class="chapter-page-button" id="chapter-page-prev" type="button">← 上一頁</button>
          <span class="chapter-page-status" id="chapter-page-status" aria-live="polite"></span>
          <button class="chapter-page-button" id="chapter-page-next" type="button">下一頁 →</button>
        </nav>
      </div>
    </dialog>

    <dialog class="final-failure-modal" id="final-failure-modal">
      <div class="final-failure-sheet">
        <p class="final-verdict">驗證失敗</p>
        <h2>我賜予您的羽翼，僅剩回憶。</h2>
        <p>錯誤的答案已斬斷你走過的痕跡。當門再次開啟，一切都將回到神話尚未開始之時。</p>
        <button class="final-return-button" id="final-reset-confirm" type="button">回到初始</button>
      </div>
    </dialog>

    <dialog class="final-success-modal" id="final-success-modal">
      <div class="final-success-visual" aria-hidden="true"></div>
      <div class="final-success-vignette" aria-hidden="true"></div>
      <div class="final-success-copy">
        <p>驗證通過</p>
        <h2>魔王支線最終章</h2>
        <strong>已解鎖</strong>
        <button class="final-continue-button" id="final-success-close" type="button">繼續見證</button>
      </div>
    </dialog>

    <dialog class="love-painting-modal" id="love-painting-modal">
      <div class="love-painting-sheet">
        <button class="close love-painting-close" type="button" data-love-painting-close>×</button>
        <img src="assets/tumi-jiangfu-oil-painting.png" alt="降伏與荼蘼並肩沉睡在暮春花田的泛黃油畫" />
        <p>我們總是在羨慕並嚮往著，我們所沒有的那些東西。</p>
      </div>
    </dialog>

    <dialog class="character-entry-modal" id="character-person-modal">
      <div class="character-entry-sheet">
        <button class="close" type="button" data-person-close>×</button>
        <h2 id="character-person-title">角色任務</h2>
        <div class="character-entry-text" id="character-person-text"></div>
      </div>
    </dialog>

    <dialog class="character-entry-modal" id="character-story-modal">
      <div class="character-entry-sheet">
        <button class="close" type="button" data-story-close>×</button>
        <h2>角色故事</h2>
        <div class="character-entry-text" id="character-story-text"></div>
      </div>
    </dialog>

    <script src="app.js?v=20260824-clean-puzzles"></script>
  </body>
</html>
